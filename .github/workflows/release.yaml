name: Stage

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and validate both channels without publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: spectrum-stage
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.dry-run)
    permissions:
      contents: write
      pull-requests: read
      packages: write
      actions: read
      attestations: write
      id-token: write
    uses: photon-hq/buildspace/.github/workflows/package-stage.yml@cfaaa6a4c8870bc21ced10f732fbbc0f4d23384d
    with:
      package: spectrum-ts
      package-selection: spectrum-ts @spectrum-ts/core @spectrum-ts/elysia @spectrum-ts/express @spectrum-ts/fastify @spectrum-ts/hono @spectrum-ts/imessage @spectrum-ts/imessage-local @spectrum-ts/slack @spectrum-ts/telegram @spectrum-ts/terminal @spectrum-ts/whatsapp-business
      registry: https://registry.npmjs.org
      tag-prefix: spectrum-ts-staging-
      production-tag-prefix: v
      environment: staging
      ci-workflow: ci.yaml
      bun-version: '1.3.14'
      setup-pnpm: false
      install: bun install --frozen-lockfile
      verify: bun run check && bun run typecheck && bun run test
      pack: bun scripts/release/pack.ts
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
